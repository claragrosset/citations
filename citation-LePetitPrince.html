<head>

			margin: 4rem;
			padding: 2rem;
			border: 2px solid lightblue;
			border-radius: 1rem;
			aspect-ratio: 1.4/1;
		}

		#renard {background: darkblue;}
		#rose {background: darkred;}

	</style>
</head>

	<div class="citations" id="rose">
		<div class="quote important">" Ce n’était qu’un renard semblable à cent mille autres. Mais j’en ai fait mon ami, et il est maintenant unique. "</div>
		<div class="source importannt">-Le Petit Prince</div>
	</div>

	<div class="citations" id="renard">
		<div class="quote important">“ C’est le temps que tu as perdu pour ta rose qui rend ta rose importante. "</div>
		<div class="source importannt">-Le Petit Prince</div>
	</div>
